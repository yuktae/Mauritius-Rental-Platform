<!--
  BORO email confirmation.

  Uses {{ .Token }} rather than {{ .ConfirmationURL }} because Phase 1 verifies
  with a six-digit code typed into the app, not a magic link. A link would open
  a new browser tab and strand the half-finished signup in the original one.

  Styles are inline: email clients strip <style> blocks, and several ignore
  anything but inline attributes.
-->
<div style="font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 32px 24px; color: #221e1a;">
  <p style="margin: 0 0 24px; font-size: 20px; font-weight: 800; color: #f5761c; letter-spacing: -0.02em;">
    BORO
  </p>

  <h1 style="margin: 0 0 12px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em;">
    Confirm your email address
  </h1>

  <p style="margin: 0 0 24px; font-size: 15px; line-height: 1.6; color: #574e45;">
    Enter this code in the app to finish creating your account.
  </p>

  <p style="margin: 0 0 24px; padding: 18px 24px; background: #f8f2e9; border-radius: 14px; text-align: center; font-size: 32px; font-weight: 700; letter-spacing: 10px; font-family: ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace;">
    {{ .Token }}
  </p>

  <p style="margin: 0 0 8px; font-size: 14px; line-height: 1.6; color: #776c60;">
    The code expires in one hour.
  </p>

  <p style="margin: 0; font-size: 14px; line-height: 1.6; color: #776c60;">
    If you didn&rsquo;t try to create a BORO account, you can ignore this email
    and nothing will happen.
  </p>
</div>
