project_id = "boro-local"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000",
  "http://localhost:3001"
]
jwt_expiry = 3600
enable_signup = true
enable_confirmations = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

# Phase 1 verifies with a six-digit code typed into the app, not a magic link,
# so the confirmation template is overridden to render {{ .Token }}. Keep this in
# step with the same template in the hosted projects.
[auth.email.template.confirmation]
subject = "Your BORO confirmation code"
content_path = "./supabase/templates/confirmation.html"

[storage]
enabled = true
file_size_limit = "10MiB"

[edge_runtime]
enabled = true
