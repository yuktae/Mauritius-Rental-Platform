name: CI

on:
  push:
    branches: [main, preprod]
  pull_request:
    branches: [main, preprod]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Build
        run: pnpm -r build
        env:
          # NEXT_PUBLIC_* values are inlined into the browser bundle at build
          # time, so a build with none produces a client that cannot reach
          # Supabase. CI only proves the workspace compiles and nothing it
          # builds is deployed, so placeholders are the right thing here. Real
          # values live on the Vercel projects.
          BORO_ENV: ci
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
