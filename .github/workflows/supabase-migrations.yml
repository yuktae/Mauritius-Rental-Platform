name: Supabase migrations

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/seed.sql"
      - "supabase/config.toml"

jobs:
  verify-migrations:
    name: Apply migrations to a clean database
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start local Supabase
        run: pnpm exec supabase start

      - name: Reset database (runs every migration plus seed)
        run: pnpm exec supabase db reset

      - name: Fail if generated types are stale
        run: |
          pnpm exec supabase gen types typescript --local > /tmp/supabase.types.ts
          if ! diff -q /tmp/supabase.types.ts packages/database/src/supabase.types.ts; then
            echo "::error::Generated Supabase types are out of date. Run 'pnpm db:types' and commit the result."
            diff /tmp/supabase.types.ts packages/database/src/supabase.types.ts || true
            exit 1
          fi
